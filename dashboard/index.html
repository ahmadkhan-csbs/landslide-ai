<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NER Landslide Early Warning System</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; }
  header { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ef4444; }
  header h1 { font-size: 22px; }
  header .live { background: #ef4444; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: 0.6; } }
  .container { display: flex; height: calc(100vh - 64px); }
  #map { flex: 1; height: 100%; }
  .sidebar { width: 340px; background: #1e293b; overflow-y: auto; padding: 15px; }
  .sidebar h2 { font-size: 16px; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .stats { display: flex; gap: 10px; margin-bottom: 15px; }
  .stat { flex: 1; background: #0f172a; padding: 12px; border-radius: 10px; text-align: center; }
  .stat .num { font-size: 24px; font-weight: bold; }
  .stat .label { font-size: 11px; color: #94a3b8; }
  .alert-card { background: #0f172a; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #22c55e; cursor: pointer; transition: transform 0.15s; }
  .alert-card:hover { transform: translateX(5px); }
  .alert-card.HIGH { border-left-color: #ef4444; }
  .alert-card.MEDIUM { border-left-color: #f59e0b; }
  .alert-card .city { font-weight: bold; font-size: 15px; }
  .alert-card .risk-line { display: flex; justify-content: space-between; margin-top: 5px; font-size: 13px; }
  .badge { padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
  .badge.HIGH { background: #ef4444; }
  .badge.MEDIUM { background: #f59e0b; }
  .badge.LOW { background: #22c55e; }
  .model-info { margin-top: 15px; padding: 12px; background: #0f172a; border-radius: 10px; font-size: 12px; color: #94a3b8; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>&#9968;&#65039; NER Landslide Early Warning System</h1>
  <span class="live">&#9679; LIVE</span>
</header>
<div class="container">
  <div id="map"></div>
  <div class="sidebar">
    <h2>&#9888;&#65039; Live Risk Alerts</h2>
    <div class="stats">
      <div class="stat"><div class="num" id="total">-</div><div class="label">Cities</div></div>
      <div class="stat"><div class="num" id="high" style="color:#ef4444">-</div><div class="label">High Risk</div></div>
      <div class="stat"><div class="num" style="color:#22c55e">93.6%</div><div class="label">Model Acc</div></div>
    </div>
    <div id="alerts"></div>
    <div class="model-info">
      <b>&#129302; AI Model:</b> Random Forest<br>
      <b>&#128202; Training Data:</b> NASA Landslide Catalog (1,265 India events)<br>
      <b>&#127782;&#65039; Top Factor:</b> Monsoon rainfall (57.8% importance)<br>
      <b>&#128269; Explainable AI:</b> Har alert ke reasons dashboard pe
    </div>
  </div>
</div>
<script>
  const map = L.map('map').setView([25.5, 92.5], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OpenStreetMap'
  }).addTo(map);

  fetch('http://127.0.0.1:8000/alerts')
    .then(r => r.json())
    .then(alerts => {
      let high = 0;
      const box = document.getElementById('alerts');
      box.innerHTML = '';
      alerts.forEach(a => {
        if (a.level === 'HIGH') high++;
        const color = a.level === 'HIGH' ? '#ef4444' : (a.level === 'MEDIUM' ? '#f59e0b' : '#22c55e');
        L.circleMarker([a.lat, a.lon], {
          radius: 14, color: color, fillColor: color, fillOpacity: 0.7, weight: 2
        }).addTo(map).bindPopup(
          '<b>' + a.name + '</b><br>Risk: ' + a.risk + '%<br>Level: ' + a.level
        );
        const card = document.createElement('div');
        card.className = 'alert-card ' + a.level;
        card.innerHTML =
          '<div class="city">' + a.name + '</div>' +
          '<div class="risk-line"><span>Risk: <b>' + a.risk + '%</b></span>' +
          '<span class="badge ' + a.level + '">' + a.level + '</span></div>';
        card.onclick = () => { map.setView([a.lat, a.lon], 9); };
        box.appendChild(card);
      });
      document.getElementById('total').textContent = alerts.length;
      document.getElementById('high').textContent = high;
    })
    .catch(err => {
      document.getElementById('alerts').innerHTML =
        '<div class="alert-card">&#10060; API se connect nahi hua. Server chalao: <br><code>python -m uvicorn app:app --reload</code></div>';
    });
</script>
</body>
</html>
